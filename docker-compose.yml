services:
  auth:
    image: ${DOCKER_USERNAME}/nexus-auth:${IMAGE_AUTH_VERSION}
    container_name: auth
    hostname: auth
    environment:
      - AUTH_COOKIE=${AUTH_COOKIE}
      - BACKEND_URL=${BACKEND_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - WEB_URL=${WEB_URL}
    command: npm start
    depends_on:
      - vibe-deployment-backend

  coolify-operator:
    image: ${DOCKER_USERNAME}/nexus-coolify-operator:${IMAGE_COOLIFY_OPERATOR_VERSION}
    container_name: coolify-operator
    hostname: coolify-operator
    environment:
      - COOLIFY_API_TOKEN_DEPLOY=${COOLIFY_API_TOKEN_DEPLOY}
      - COOLIFY_API_TOKEN_READ=${COOLIFY_API_TOKEN_READ}
      - COOLIFY_API_TOKEN_WRITE=${COOLIFY_API_TOKEN_WRITE}
      - COOLIFY_API_URL=${COOLIFY_API_URL}
    command: npm start

  db:
    image: postgres:${IMAGE_DB_VERSION}
    container_name: db
    hostname: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKER_USERNAME}/nexus-web:${IMAGE_WEB_VERSION}
    container_name: web
    hostname: web
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      - auth
      - coolify-operator
      - vibe-deployment-frontend

  vibe-deployment-backend:
    image: ${DOCKER_USERNAME}/nexus-vibe-deployment-backend:${IMAGE_VIBE_DEVELOPMENT_BACKEND_VERSION}
    container_name: vibe-deployment-backend
    hostname: vibe-deployment-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      MODEL: ${MODEL}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      COOLIFY_BASE_URL: ${COOLIFY_BASE_URL}
      COOLIFY_ACCESS_TOKEN: ${COOLIFY_ACCESS_TOKEN}
      COOLIFY_APPS_DOMAIN: ${COOLIFY_APPS_DOMAIN}
      PORT: 4000
      NODE_ENV: ${NODE_ENV}
    command: sh -c "npm run db:push && npm run dev"

  vibe-deployment-frontend:
    image: ${DOCKER_USERNAME}/nexus-vibe-deployment-frontend:${IMAGE_VIBE_DEVELOPMENT_FRONTEND_VERSION}
    container_name: vibe-deployment-frontend
    hostname: vibe-deployment-frontend
    depends_on:
      - vibe-deployment-backend
    environment:
      AUTH_COOKIE: ${AUTH_COOKIE}
      BACKEND_URL: ${BACKEND_URL}
      NODE_ENV: ${NODE_ENV}
    command: npm run dev

volumes:
  pg_data:
